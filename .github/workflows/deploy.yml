name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Kích hoạt khi có thay đổi trên nhánh main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code từ repository
        uses: actions/checkout@v3

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v2

      - name: Upload file lên GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: .  # Nếu website nằm trong thư mục con, đổi lại

      - name: Triển khai lên GitHub Pages
        uses: actions/deploy-pages@v1
